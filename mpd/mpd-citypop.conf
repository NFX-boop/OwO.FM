# /etc/mpd/mpd-citypop.conf — City Pop channel (no VIBE modes)
music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/citypop/playlists"
db_file             "/var/lib/mpd/citypop/tag_cache"
state_file          "/var/lib/mpd/citypop/state"
sticker_file        "/var/lib/mpd/citypop/sticker.sql"
log_file            "/var/log/mpd/mpd-citypop.log"
pid_file            "/run/mpd/mpd-citypop.pid"
bind_to_address     "127.0.0.1"
port                "6601"
user                "mpd"

audio_output {
    type            "httpd"
    name            "CityPop Stream"
    encoder         "lame"
    port            "8002"
    bind_to_address "127.0.0.1"
    bitrate         "128"
    format          "44100:16:2"
    max_clients     "16"
}

# silent local sink so MPD doesn't require ALSA hardware
audio_output {
    type "null"
    name "Null"
}
