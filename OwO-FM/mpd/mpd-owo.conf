# /etc/mpd/mpd-owo.conf — OwO channel (VIBE playlist: owo/party + owo/chill)
music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/owo/playlists"
db_file             "/var/lib/mpd/owo/tag_cache"
state_file          "/var/lib/mpd/owo/state"
sticker_file        "/var/lib/mpd/owo/sticker.sql"
log_file            "/var/log/mpd/mpd-owo.log"
pid_file            "/run/mpd/mpd-owo.pid"
bind_to_address     "127.0.0.1"
port                "6600"
user                "mpd"

audio_output {
    type            "httpd"
    name            "OwO Stream"
    encoder         "lame"
    port            "8001"
    bind_to_address "127.0.0.1"
    bitrate         "128"
    format          "44100:16:2"
    max_clients     "16"
}

# silent local sink so MPD doesn't require ALSA hardware
audio_output {
    type "null"
    name "Null"
}
